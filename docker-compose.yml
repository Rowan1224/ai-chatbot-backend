services:

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: mongo-test
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: admin
      MONGODB_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    security_opt:
      - seccomp:unconfined   # handles kernel 6.x compatibility
  # PostgreSQL + pgvector for document storage and vector search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-chatbot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_password
      POSTGRES_DB: chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-chatbot-network

  # Redis service for LangGraph checkpointing
  redis:
    image: redis/redis-stack-server:latest
    container_name: ai-chatbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ai-chatbot-network

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-chatbot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env  # Load environment variables from .env file
    environment:
      # Override specific variables for Docker environment
      - POSTGRESQL_URL=postgresql://chatbot:chatbot_password@postgres:5432/chatbot
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-chatbot-network
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  ai-chatbot-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local

