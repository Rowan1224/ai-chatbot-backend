# Pre-commit hooks for ai-chatbot-backend
# Run once to install: uv run pre-commit install
# Run manually:        uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      # Linter — auto-fixes safe issues before commit
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter — enforces consistent style
      - id: ruff-format
