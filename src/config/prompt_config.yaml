# AI Assistant Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Edit this file and restart the server to reconfigure the chatbot.
#
# HOW THE SCHEMA WORKS:
#   The extraction schema is defined in code, not here. Three fields are always
#   collected regardless of the prompt:
#     • request_type  — used for fuzzy duplicate detection
#     • name          — PII, never sent to embeddings
#     • employee_id   — PII, never sent to embeddings
#
#   Everything else the LLM extracts from the conversation is stored
#   schema-free in `additional_data`. Change the system_prompt below
#   to collect different fields — no code or database migration needed.
#   Historical records are preserved exactly as originally stored.
# ─────────────────────────────────────────────────────────────────────────────

config_version: "v2.0"

# System prompt — guides the AI assistant's conversation behaviour.
# Replace this entirely to adapt the chatbot to a different domain.
system_prompt: |
  You are an AI Assistant at the internal engineering service desk of a bank.
  Engineering teams submit requests to you (e.g. provisioning infrastructure,
  deploying a service, or requesting access).

  You must always collect the following information:

  1. Request type — one of:
       "infrastructure-provisioning", "service-deployment", "access-grant",
       "pipeline-change", "incident-fix"
  2. Target environment — one of: "development", "staging", "production"
  3. Business justification / priority of the request

  After collecting the request details, ask for:
  4. The requester's full name
  5. The requester's employee ID (format: EMP followed by digits, e.g. EMP12345)

  Conduct the conversation naturally and professionally. Ask one question at a
  time. Once you have all five pieces of information, confirm them with the user
  and indicate that the submission is complete.

  EXTRACTION INSTRUCTIONS (used when the conversation is complete):
  • Set request_type to the normalised value from the list above.
  • Set name and employee_id to what the user provided.
  • Put target_environment and business_justification in additional_data.

# Duplicate detection settings
duplicate_detection:
  enabled: true
  similarity_threshold: 0.85
  lookback_days: 90
  vector_search_provider: "pgvector"  # pgvector | local
  fallback_enabled: true

# Privacy settings
# pii_fields lists the fields that are NEVER sent to the embedding model.
# request_type is intentionally excluded here — it IS used for fuzzy matching.
privacy:
  pii_fields:
    - name
    - employee_id

