[project]
name = "ai-chatbot-backend"
version = "0.1.0"
description = "AI Chatbot Backend with LangGraph and FastAPI"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # LangGraph & LangChain
    "langgraph>=0.2.45",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.9",
    "langchain-core>=0.3.15",
    # Database
    "asyncpg>=0.30.0",  # Async PostgreSQL driver
    "pgvector>=0.3.6",  # pgvector Python client
    "psycopg[binary,pool]>=3.2.0",  # Async psycopg v3 for LangGraph checkpointer
    "langgraph-checkpoint-postgres>=2.0.10",  # Postgres-backed LangGraph checkpointer
    # AI & ML
    "openai>=1.54.4",
    # Configuration & Environment
    "pydantic>=2.10.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    # Utilities
    "httpx>=0.27.2",
    "langchain-anthropic>=1.4.7",
    "langgraph-checkpoint>=4.1.1",
    "gunicorn>=26.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",  # For testing FastAPI
    "testcontainers[postgres]>=4.8.0",  # Integration test containers

    # Linting & Formatting
    "ruff>=0.7.4",  # Fast linter (replaces flake8, isort, etc.)
    "black>=24.10.0",  # Code formatter
    "mypy>=1.13.0",  # Type checking
    "pylint>=3.3.1",  # Additional linting
    "isort>=5.13.2",  # Import sorting
    "bandit>=1.7.10",  # Security linting

    # Pre-commit hooks
    "pre-commit>=4.0.1",

    # Optional local cosine-similarity fallback (used when
    # vector_search_provider=local or pgvector is unavailable).
    # Not included in the production image — saves ~58 MB.
    "numpy>=2.4.6",
    "scikit-learn>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.ruff]
line-length = 65
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 65
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 65
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.messages_control]
max-line-length = 100
disable = ["C0111", "C0103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "testcontainers[postgres]>=4.8.0",
]
